[package]
name = "backtick"
version = "0.2.2"
edition = "2021"
description = "A razor-sharp Markdown document reader"
homepage = "https://originalmmd.github.io/backtick"
repository = "https://github.com/originalmmd/backtick"
license = "MIT"
authors = ["Robin <originalmmd@gmail.com>"]
readme = "../README.md"

[lib]
name = "backtick_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-shell = "2.3"
tauri-plugin-single-instance = "2.4"
tauri-plugin-dialog = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.time]
version = "=0.3.36"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
