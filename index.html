<!DOCTYPE html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backtick</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="settings-bar">
      <button id="settings-btn" class="settings-btn" title="Settings">&#9881;</button>
      <div id="settings-panel" class="settings-panel">
        <label for="theme-select">Color Scheme</label>
        <select id="theme-select" class="theme-select">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
    <div id="app">
      <div id="loading">
        <p>Backtick</p>
        <p class="subtitle">Open a .md file to get started</p>
        <button id="open-btn" class="open-btn">Open File</button>
        <p class="drop-hint">or drop a .md file here</p>
      </div>
      <div id="content" class="markdown-body"></div>
      <div id="drop-overlay" class="drop-overlay">
        <p>Drop .md file to open</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
