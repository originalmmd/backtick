name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libgtk-3-dev
          libayatana-appindicator3-dev librsvg2-dev
          libssl-dev libjavascriptcoregtk-4.1-dev
          pkg-config
      - name: Install Rust toolchain
        run: rustup update stable
      - uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Inject postinst into .deb
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          for deb in src-tauri/target/release/bundle/deb/*.deb; do
            echo "Injecting postinst into $deb"
            tmpdir=$(mktemp -d)
            ar x "$deb" --output="$tmpdir"
            ls "$tmpdir"
            extracted=$(mktemp -d)
            ctrl=""
            for f in "$tmpdir"/control.tar.*; do
              [ -f "$f" ] && ctrl="$f" && break
            done
            if [ -z "$ctrl" ]; then
              echo "  ERROR: no control archive found in deb"
              rm -rf "$tmpdir" "$extracted"
              continue
            fi
            echo "  Found control archive: $(basename $ctrl)"
            case "$ctrl" in
              *.xz) tar -xJf "$ctrl" -C "$extracted" ;;
              *.zst) tar --zstd -xf "$ctrl" -C "$extracted" ;;
              *.gz) tar -xzf "$ctrl" -C "$extracted" ;;
              *) tar -xf "$ctrl" -C "$extracted" ;;
            esac
            if [ ! -f "$extracted/postinst" ]; then
              cp "$GITHUB_WORKSPACE/src-tauri/gen/deb/postinst" "$extracted/postinst"
              chmod 755 "$extracted/postinst"
              cd "$extracted"
              case "$ctrl" in
                *.xz) tar -cJf "$ctrl" . ;;
                *.zst) tar --zstd -cf "$ctrl" . ;;
                *.gz) tar -czf "$ctrl" . ;;
                *) tar -cf "$ctrl" . ;;
              esac
              cd "$GITHUB_WORKSPACE"
              echo "  postinst injected successfully"
            else
              echo "  postinst already present"
            fi
            rm -rf "$tmpdir" "$extracted"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true
